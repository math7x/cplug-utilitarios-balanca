<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root {
    /* Paleta estritamente Preto & Cinza */
    --bg: #000000;
    --card: #111111;
    --linha: #262626;
    --txt: #e5e5e5;
    --fraco: #737373;
    --branco: #ffffff;
  }
  
  * { box-sizing: border-box; }
  
  body {
    width: 480px; height: 560px; margin: 0; 
    background: var(--bg); color: var(--txt);
    font: 13px/1.4 system-ui, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }

  header {
    padding: 12px 16px; 
    background: var(--bg);
    border-bottom: 1px solid var(--linha);
    display: flex; align-items: center; gap: 12px;
  }
  
  header img { height: 32px; width: auto; flex: none; }
  header .txt { min-width: 0; }
  h1 { margin: 0; font-size: 14px; font-weight: 500; color: var(--branco); }
  .sub { color: var(--fraco); font-size: 12px; margin-top: 2px; }

  /* Abas secas e integradas */
  .abas {
    display: flex; gap: 4px; padding: 12px 16px 0;
    border-bottom: 1px solid var(--linha);
  }
  
  .aba {
    padding: 6px 12px; cursor: pointer;
    border: 1px solid transparent; border-bottom: none;
    color: var(--fraco); font-weight: 500; font-size: 13px;
    background: transparent; border-radius: 4px 4px 0 0;
  }
  
  .aba:hover:not(.ativa) { color: var(--txt); }
  
  .aba.ativa {
    color: var(--branco); 
    border-color: var(--linha);
    background: var(--card);
  }

  /* Notificação em alto contraste */
  .aba .pino {
    display: inline-block; padding: 2px 6px; margin-left: 6px;
    background: var(--branco); color: #000; border-radius: 2px;
    font-size: 10px; font-weight: 700;
  }
  .aba .pino:empty { display: none; }

  .painel { flex: 1; overflow-y: auto; padding: 16px; display: none; background: var(--card); }
  .painel.ativo { display: block; }

  /* Inputs simples e focados */
  .busca {
    width: 100%; padding: 8px 10px; margin-bottom: 16px;
    background: var(--bg); border: 1px solid var(--linha); 
    border-radius: 4px; color: var(--txt); font-size: 13px;
  }
  .busca:focus {
    outline: none; border-color: var(--fraco);
  }
  .busca::placeholder { color: var(--fraco); }

  /* Lista de Itens minimalista */
  .item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--linha);
  }
  .item:last-child { border-bottom: none; }
  
  .item .info { flex: 1; min-width: 0; }
  .item .nome { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--txt); }
  .item .cod { color: var(--fraco); font-size: 12px; margin-top: 2px; }
  
  .item input[type=number] {
    width: 60px; padding: 6px; text-align: center;
    background: var(--bg); border: 1px solid var(--linha); border-radius: 4px;
    color: var(--branco); font-weight: 600; font-size: 13px;
  }
  .item input[type=number]:focus {
    outline: none; border-color: var(--fraco);
  }
  .item input[type=number]:disabled { opacity: 0.3; }
  
  .item label {
    display: flex; align-items: center; gap: 6px; color: var(--fraco);
    font-size: 12px; cursor: pointer;
  }
  .item label:hover { color: var(--txt); }
  
  /* Feedback de "Salvo" em branco puro */
  .salvo { color: var(--branco); font-size: 12px; width: 14px; opacity: 0; }
  .salvo.on { opacity: 1; }

  .vazio { color: var(--fraco); text-align: center; padding: 32px 16px; font-size: 13px; }
  
  /* Dica sem cores chamativas, apenas um bloco delimitado */
  .dica {
    background: var(--bg); border: 1px solid var(--linha);
    padding: 10px 12px; border-radius: 4px; margin-bottom: 16px;
    color: var(--fraco); font-size: 12px; line-height: 1.4;
  }

  /* Rodapé utilitário */
  footer {
    padding: 12px 16px; background: var(--bg);
    border-top: 1px solid var(--linha);
    display: flex; align-items: center; gap: 8px; 
    font-size: 12px; color: var(--fraco);
  }
  footer .cont { flex: 1; }
  
  button.acao {
    padding: 6px 10px; border-radius: 4px; cursor: pointer; 
    font-weight: 500; font-size: 12px;
    background: var(--card); color: var(--txt); border: 1px solid var(--linha);
  }
  button.acao:hover { 
    background: var(--linha); color: var(--branco);
  }
</style>
</head>
<body>

<header>
  <img src="logo.png" alt="UP Tecnologias">
  <div class="txt">
    <h1>Validade dos produtos — Balança</h1>
    <div class="sub" id="resumo">carregando…</div>
  </div>
</header>

<div class="abas">
  <button class="aba ativa" data-painel="pendentes">
    Novos <span class="pino" id="pinoPendentes"></span>
  </button>
  <button class="aba" data-painel="todos">Todos os produtos</button>
</div>

<div class="painel ativo" id="painel-pendentes">
  <div class="dica">
    Produtos que apareceram numa carga e ainda não têm validade definida.
    Enquanto estiverem aqui, saem com <b>000</b> — vencendo no mesmo dia.
  </div>
  <div id="listaPendentes"></div>
</div>

<div class="painel" id="painel-todos">
  <input class="busca" id="busca" type="search" placeholder="Buscar por nome ou código…" autocomplete="off">
  <div id="listaTodos"></div>
</div>

<footer>
  <span class="cont" id="rodape"></span>
  <button class="acao" id="btnExportar" title="Baixa um validades.json com a configuração atual. Substitua o arquivo na pasta da extensão para levar para outro computador.">Exportar</button>
  <button class="acao" id="btnImportar" title="Carrega um validades.json e substitui a configuração atual">Importar</button>
  <button class="acao" id="btnRestaurar" title="Reaplica a tabela do validades.json que está na pasta da extensão">Restaurar</button>
  <input type="file" id="arquivoImport" accept=".json,application/json" style="display:none">
</footer>

<script src="popup.js"></script>
</body>
</html>
